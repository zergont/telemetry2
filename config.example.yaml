# ============================================================
# Универсальный Modbus-декодер — Конфигурация
# ============================================================
# Скопируйте этот файл в config.yaml и измените параметры под себя.
# ============================================================

# ------------------------------------------------------------
# Настройки MQTT-брокера
# ------------------------------------------------------------
mqtt:
  # Хостнейм или IP-адрес брокера
  host: "localhost"

  # Порт брокера (обычно 1883 для TCP, 8883 для TLS)
  port: 1883

  # Client ID (должен быть уникальным для каждого подключения)
  client_id: "modbus-decoder"

  # Аутентификация (оставьте пустым, если не требуется)
  username: ""
  password: ""

  # Настройки переподключения
  reconnect_delay_sec: 5

  # Шаблоны топиков
  # Подписка на RAW телеметрию (+ — wildcard для SN роутера)
  raw_topic_pattern: "cg/v1/telemetry/SN/+"

  # Базовый топик для публикации декодированных данных
  # Формат выходного топика: <base>/<router_sn>/<device_type>/<bserver_id>
  decoded_topic_base: "cg/v1/decoded/SN"

# ------------------------------------------------------------
# Настройки Web UI
# ------------------------------------------------------------
web:
  # Хост для bind (0.0.0.0 — все интерфейсы)
  host: "0.0.0.0"

  # Порт веб-интерфейса
  port: 8080

  # Включить debug-режим (auto-reload, подробные ошибки)
  debug: false

# ------------------------------------------------------------
# Настройки монитора состояния
# ------------------------------------------------------------
health:
  # Секунд без сообщений до статуса "stale"
  stale_threshold_sec: 10

  # Секунд без сообщений до статуса "offline"
  offline_threshold_sec: 60

  # Интервал проверки состояния
  check_interval_sec: 5

# ------------------------------------------------------------
# Контроль метки времени (clock_guard)
# ------------------------------------------------------------
# Проверяет date_iso_8601 каждой Modbus-записи относительно времени
# приёма MQTT-сообщения: offset = метка − время приёма (по NTP сервера).
# Статус считается по каждой записи отдельно (пачки бывают смешанными).
# GPS-сообщения не проверяются.
#
# Статусы (ts_status в decoded) и что делается с записью:
#   ok           норма (живая доставка, offset от −60 с до +120 с) — как есть
#   late         залежалая доставка (offset < −60 с) — как есть, только флаг
#   tz_shift     метка ушла на целое число часов (сеть отдала неверный пояс):
#                  k > 0 — сразу, с первой записи. В режиме correct метка
#                          исправляется на ts − k·3600 (ts_status=corrected),
#                          в режиме flag — как есть, с флагом;
#                  k < 0 — только после подтверждения, только флаг
#   future       метка впереди, но не на целые часы — в decoded НЕ публикуется,
#                уходит в карантин (в обоих режимах)
#   offset_jump  устойчивый отход от базового offset роутера — как есть, флаг
#   invalid      метка не разобралась / без пояса / раньше min_valid_date —
#                timestamp заменяется временем приёма, исходная — в ts_original
#
# Рекомендация: первые 1–2 недели работать в режиме flag и смотреть
# раздел «Метка времени» на /devices, затем переключить на correct.
#
# ВНИМАНИЕ: Web UI перезаписывает config.yaml через yaml.safe_dump —
# комментарии в config.yaml при этом пропадают. Документация по ключам —
# здесь (config.example.yaml) и в README.md.
# ------------------------------------------------------------
clock_guard:
  # Включить проверку (false — публикация как раньше, без новых полей).
  # Выключить можно и короче: clock_guard: false. Выключение действует,
  # даже если в остальных ключах секции ошибка.
  enabled: true

  # Режим по умолчанию: flag (только пометка) | correct (исправлять tz_shift k>0)
  mode: "flag"

  # Переопределение режима для отдельных роутеров.
  # SN роутера — строка в кавычках. Допустимо "<sn>": "correct"
  # или "<sn>": {mode: "correct"}.
  routers: {}
  # Пример:
  # routers:
  #   "1126246373": "correct"
  #   "6003790403":
  #     mode: "flag"

  # --- Пороги классификации (секунды) ---
  # ε: offset больше — метка «впереди» (tz_shift k>0 или future)
  epsilon_sec: 120
  # offset меньше −late_sec — late
  late_sec: 60
  # Метки раньше этой даты — invalid
  min_valid_date: "2024-01-01"
  # Максимальный сдвиг пояса, часов (k = 1…max_shift_hours)
  max_shift_hours: 14
  # tz_shift k>0: offset ∈ [k·3600 − shift_early_sec; k·3600 + shift_late_sec]
  shift_early_sec: 1800
  shift_late_sec: 120

  # --- tz_shift k<0 (только с подтверждением, до него — late) ---
  # Допуск offset вокруг k·3600
  neg_shift_tolerance_sec: 120
  # Смещение должно держаться не меньше (по времени приёма)
  neg_shift_confirm_sec: 120
  # Минимум разных меток
  neg_shift_min_stamps: 3
  # Максимальный разброс offset
  neg_shift_max_spread_sec: 30
  # Максимальная пауза приёма внутри серии
  neg_shift_max_gap_sec: 30

  # --- offset_jump (отход от базового offset роутера) ---
  # Порог отхода от базового offset
  jump_threshold_sec: 600
  # Отход должен держаться не меньше (по времени приёма)
  jump_confirm_sec: 60
  # Минимум разных меток
  jump_min_stamps: 3
  # Максимальный разброс offset внутри серии
  jump_max_spread_sec: 60
  # Максимальная пауза приёма внутри серии
  jump_max_gap_sec: 30
  # Базовый offset — медиана последних живых записей (от min до max штук)
  baseline_min_samples: 15
  baseline_max_samples: 30

  # --- Эпизоды и сигналы ---
  # Эпизод закрывается после стольких разных нормальных меток
  episode_close_normal_stamps: 2
  # ...или при молчании роутера дольше (минут)
  episode_silence_close_min: 10
  # Сигнал «роутер молчит после tz_shift k>0»: молчание дольше (секунд)
  silence_alert_sec: 60
  # ...если последняя запись tz_shift k>0 была не раньше чем за столько секунд
  # до последней записи роутера
  silence_lookback_sec: 300
  # Сколько закрытых эпизодов хранить в памяти (журнал для Web UI)
  episodes_keep: 200

  # --- Карантин (записи future) ---
  # Повторная публикация из карантина в cg/v1/decoded ЗАПРЕЩЕНА: это ломает
  # в db-writer обнаружение разрывов, latest_state и периоды состояний.
  # Пустая строка "" — выключить; ключ без значения (file:) — это null,
  # то есть значение по умолчанию, а не «выключено».
  quarantine:
    # Ротируемый JSONL-файл (по строке на запись). "" — не писать.
    # Файл — единственная копия записей future: ошибка записи (нет прав,
    # диск заполнен) считается в errors и пишется в лог ERROR.
    file: "logs/clock_quarantine.jsonl"
    # Размер файла до ротации, байт (10 МБ). Не меньше 1: 0 отключил бы
    # ротацию — такое значение заменяется на 10 МБ с предупреждением в лог
    max_bytes: 10485760
    # Число архивных файлов. Не меньше 1: при 0 ротации нет вовсе —
    # такое значение заменяется на 1 с предупреждением в лог
    backup_count: 5
    # Топик только для наблюдения: <topic_base>/<router_sn>/<device_type>/<bserver_id>
    # (qos 0, без retain). "" — не публиковать.
    # Не может быть под decoded-топиком — такая публикация блокируется.
    topic_base: "cg/v1/quarantine/SN"

# ------------------------------------------------------------
# Устройства и карты регистров
# ------------------------------------------------------------
# Каждый тип устройства — отдельная директория с картами.
# payload_keys — ключи из MQTT payload, соответствующие этому типу.
#
# Структура директории карт:
#   register_map.jsonl      — определения регистров (JSONL)
#   enum_map.json           — определения enum-значений (JSON)
#   fault_bitmap_map.jsonl  — определения fault bitmap (JSONL)
#
# Чтобы добавить новый тип устройства:
#   1. Создайте директорию maps/<device_type>/
#   2. Поместите в неё файлы карт
#   3. Добавьте секцию ниже с payload_keys
# ------------------------------------------------------------
devices:
  pcc:
    maps_dir: "maps/pcc"
    payload_keys:
      - "PCC_3_3"

  # Пример добавления нового устройства:
  # dse:
  #   maps_dir: "maps/dse"
  #   payload_keys:
  #     - "DSE_8610"
  #     - "Modbus_DSE"

# ------------------------------------------------------------
# Настройки логирования
# ------------------------------------------------------------
logging:
  # Уровень логирования: DEBUG, INFO, WARNING, ERROR
  level: "INFO"

  # Лог в файл (пусто = только консоль)
  file: ""

  # Формат логов
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"

# ------------------------------------------------------------
# Режим работы
# ------------------------------------------------------------
# debug: подробные логи, raw вход/выход, причины ошибок декодирования
# production: минимальное логирование
mode: "production"
